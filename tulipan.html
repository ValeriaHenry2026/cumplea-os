<!DOCTYPE html>
<html lang="es" class="page-tulipan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#01060b">
  <title>Un tulipán para ti ♥</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/epic.css?v=2">
</head>
<body class="page-tulipan">
  <button id="tulip-start" type="button">Ver florecer el tulipán</button>
  <div id="tulip-stage" aria-label="Animación de un tulipán floreciendo">
    <div id="tulip-gl"></div>
    <div class="vignette" aria-hidden="true"></div>
    <h1 id="msg" class="msg" aria-live="polite"></h1>
    <p id="replay" class="replay">Toca para verlo otra vez</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/epic.js"></script>
</body>
</html>
